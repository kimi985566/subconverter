# Miaomiaowu custom rule: type=dns, mode=replace. No proxy/node objects.
---
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  default-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  nameserver:
  - https://1.1.1.1/dns-query#DNS-Remote
  - https://8.8.8.8/dns-query#DNS-Remote
  nameserver-policy:
    "+.wangdu.site":
    - https://1.1.1.1/dns-query#DNS-Remote
    - https://8.8.8.8/dns-query#DNS-Remote
    "+.openai.com":
    - https://1.1.1.1/dns-query#DNS-Remote
    - https://8.8.8.8/dns-query#DNS-Remote
    "+.xn--ngstr-lra8j.com":
    - https://1.1.1.1/dns-query#DNS-Remote
    - https://8.8.8.8/dns-query#DNS-Remote
    geosite:private:
    - system
    geosite:cn:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
