[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
;共用隐私例外：app.adjust.com 必须先于 UnBan；地区定向与本机游戏规则留在 OpenClash。
ruleset=🍃 应用净化,[]DOMAIN,app.adjust.com

